Home:
  ha-card-border-radius: 16px
  ha-font-family: "'IBM Plex Sans', sans-serif"
  primary-font-family: "'IBM Plex Sans', sans-serif"
  ha-view-sections-column-gap: 16px
  ha-view-sections-row-gap: 16px
  modes:
    light:
      primary-background-color: "#F4F1EB"
      secondary-background-color: "#FFFFFF"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      ha-card-border-width: 0px
      ha-card-box-shadow: "0 8px 24px rgba(26, 29, 33, 0.06)"
      primary-text-color: "#1A1D21"
      secondary-text-color: "#5C656D"
      text-primary-color: "#1A1D21"
      primary-color: "#8A6A32"
      accent-color: "#8A6A32"
      divider-color: "rgba(26, 29, 33, 0.08)"
      app-header-background-color: "#F4F1EB"
      app-header-text-color: "#1A1D21"
      app-header-selection-bar-color: "#8A6A32"
      sidebar-background-color: "#F4F1EB"
      sidebar-text-color: "#1A1D21"
      sidebar-icon-color: "#5C656D"
      sidebar-selected-background-color: "#FFFFFF"
      sidebar-selected-icon-color: "#8A6A32"
      sidebar-selected-text-color: "#1A1D21"
      switch-checked-color: "#8A6A32"
      state-alarm-disarmed-color: "#246848"
      state-alarm-armed-color: "#2E4660"
      state-alarm-pending-color: "#8F5314"
      state-alarm-triggered-color: "#8E2E28"
      state-lock-locked-color: "#246848"
      state-lock-unlocked-color: "#8F5314"
      product-disarmed: "#246848"
      product-armed-home: "#8F5314"
      product-armed-away: "#2E4660"
      product-triggered: "#8E2E28"
      product-action: "#8A6A32"
      product-open: "#8F5314"
    dark:
      primary-background-color: "#101214"
      secondary-background-color: "#23282E"
      card-background-color: "#1A1D21"
      ha-card-background: "#1A1D21"
      ha-card-border-width: 1px
      ha-card-border-color: "rgba(255, 255, 255, 0.08)"
      ha-card-box-shadow: none
      primary-text-color: "#F2F4F6"
      secondary-text-color: "#A7B0B8"
      text-primary-color: "#F2F4F6"
      primary-color: "#C4A46A"
      accent-color: "#C4A46A"
      divider-color: "rgba(255, 255, 255, 0.08)"
      app-header-background-color: "#101214"
      app-header-text-color: "#F2F4F6"
      app-header-selection-bar-color: "#C4A46A"
      sidebar-background-color: "#101214"
      sidebar-text-color: "#F2F4F6"
      sidebar-icon-color: "#A7B0B8"
      sidebar-selected-background-color: "#1A1D21"
      sidebar-selected-icon-color: "#C4A46A"
      sidebar-selected-text-color: "#F2F4F6"
      switch-checked-color: "#C4A46A"
      state-alarm-disarmed-color: "#2F7D5B"
      state-alarm-armed-color: "#3E5C78"
      state-alarm-pending-color: "#B86A22"
      state-alarm-triggered-color: "#B33B34"
      state-lock-locked-color: "#2F7D5B"
      state-lock-unlocked-color: "#B86A22"
      product-disarmed: "#2F7D5B"
      product-armed-home: "#B86A22"
      product-armed-away: "#3E5C78"
      product-triggered: "#B33B34"
      product-action: "#C4A46A"
      product-open: "#B86A22"
