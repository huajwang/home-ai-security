<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge library</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --soft: #f6f5f4;
      --line: #e9e8e6;
      --text: #191919;
      --muted: #6f6e69;
      --accent: #191919;
      --danger: #c4322c;
      --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif;
      --sans: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .gate {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: auto;
      background: var(--soft);
    }
    .signin {
      width: min(420px, 100%);
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px 22px;
    }
    .signin h1 { margin: 0 0 6px; font-family: var(--serif); font-size: 2rem; font-weight: 650; }
    .signin p { margin: 0 0 18px; color: var(--muted); font-size: 0.95rem; }
    label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 0.82rem; }
    input, textarea {
      width: 100%;
      background: white;
      color: var(--text);
      border: 1px solid #e3e2e0;
      border-radius: 8px;
      padding: 10px 12px;
    }
    textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
    .primary, .quiet, .danger {
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
    }
    .primary { background: var(--accent); color: white; }
    .quiet { background: var(--soft); color: var(--text); }
    .danger { background: transparent; color: var(--danger); border: 1px solid #f0c2c0; border-radius: 8px; }
    .danger.confirm { background: var(--danger); color: white; border: 0; }
    .signin .primary { width: 100%; margin-top: 16px; }
    .app {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-shrink: 0;
      padding: 14px 28px 0;
      padding-top: max(14px, env(safe-area-inset-top));
      background: white;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 0; }
    .brand strong { font-family: var(--serif); font-size: 1.35rem; font-weight: 650; }
    .back { display: none; border-radius: 999px; }
    .categories {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .cat {
      flex: 0 0 auto;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      padding: 12px 0 10px;
      font-size: 0.98rem;
    }
    .cat.active { color: var(--text); font-weight: 650; border-bottom-color: var(--text); }
    .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; padding-bottom: 8px; }
    .tools input { width: 180px; background: var(--soft); border-color: transparent; }
    .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .board, .reader { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
    .app.reading .board { display: none; }
    .app:not(.reading) .reader { display: none; }
    .app.reading .back { display: inline-flex; }
    .board { padding: 28px 32px 56px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 36px 28px;
    }
    .card {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      border: 0;
      padding: 0;
    }
    .card img, .cover {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 12px;
      background: var(--soft);
      margin-bottom: 14px;
      display: block;
    }
    .kicker { color: var(--muted); font-size: 0.82rem; margin: 0 0 6px; }
    .card h2 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .card p {
      margin: 0;
      color: #37352f;
      font-size: 0.98rem;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pane {
      width: min(740px, 100%);
      margin: 0 auto;
      padding: 36px 24px 72px;
    }
    .pane h2 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 2.5rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .title-edit { font-family: var(--serif); font-size: 1.8rem; font-weight: 650; margin-bottom: 12px; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
    .body { white-space: pre-wrap; line-height: 1.65; font-size: 1.05rem; }
    .pictures { display: grid; gap: 12px; margin-top: 24px; }
    .shot { position: relative; }
    .shot img { width: 100%; border-radius: 12px; background: var(--soft); display: block; }
    .remove-photo {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(25, 25, 25, 0.78);
      color: white;
      display: grid;
      place-items: center;
    }
    .remove-photo svg { width: 18px; height: 18px; display: block; }
    .remove-photo.confirm {
      width: auto;
      min-width: 40px;
      padding: 0 12px;
      background: var(--danger);
      color: white;
      font-size: 0.85rem;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 22px; }
    .pick {
      display: inline-flex;
      align-items: center;
      margin: 0;
      background: var(--soft);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 1rem;
    }
    .pick input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    .empty { color: var(--muted); line-height: 1.5; }
    .status { min-height: 1.2em; color: #3156c4; font-size: 0.88rem; margin: 8px 0 0; }
    .status-bar {
      flex-shrink: 0;
      margin: 0;
      padding: 4px 28px max(10px, env(safe-area-inset-bottom));
    }
    @media (max-width: 1100px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .board { padding: 22px 22px 48px; }
    }
    @media (max-width: 719px) {
      .top { flex-wrap: wrap; gap: 8px 12px; padding: 12px 14px 0; padding-top: max(12px, env(safe-area-inset-top)); }
      .brand { flex: 1; }
      .categories { order: 3; flex: 1 0 100%; gap: 16px; }
      .tools { order: 4; flex: 1 0 100%; margin-left: 0; padding-bottom: 10px; }
      .tools input { width: auto; flex: 1; min-width: 0; }
      .board { padding: 18px 14px 40px; }
      .cards { grid-template-columns: 1fr; gap: 28px; }
      .pane { padding: 20px 16px 48px; }
      .pane h2 { font-size: 1.85rem; }
      textarea { min-height: 40vh; }
      .primary, .quiet, .danger, .pick, .remove-photo, .cat { min-height: 44px; }
      .cat { padding-top: 8px; }
      .remove-photo { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <form class="signin" id="login">
      <h1>Knowledge library</h1>
      <p>Sign in with the same account as the phone.</p>
      <label for="user">Username</label>
      <input id="user" value="owner" autocomplete="username" />
      <label for="pass">Password</label>
      <input id="pass" type="password" value="changeme" autocomplete="current-password" />
      <p class="status" id="login-status"></p>
      <button class="primary" id="signin" type="submit">Sign in</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <header class="top">
      <div class="brand">
        <button class="back quiet" id="back" type="button">Library</button>
        <strong>Knowledge library</strong>
      </div>
      <nav class="categories" id="categories" aria-label="Categories"></nav>
      <div class="tools">
        <input id="query" placeholder="Search" aria-label="Search notes" />
        <button class="primary" id="new-note" type="button">New note</button>
        <button class="quiet" id="signout" type="button">Sign out</button>
      </div>
    </header>
    <datalist id="known-categories"></datalist>
    <div class="stage">
      <div class="board" id="board"></div>
      <div class="reader" id="reader">
        <section class="pane" id="pane"></section>
      </div>
    </div>
    <p class="status status-bar" id="status"></p>
  </div>

  <script>
    const tokenKey = "libraryToken";
    let notes = [];
    let selected = "";
    let category = "Latest";
    let composing = false;
    let editing = false;
    let confirmDelete = false;
    let confirmPicture = "";
    let showReader = false;

    function token() { return sessionStorage.getItem(tokenKey) || ""; }
    function setStatus(text) {
      document.getElementById("status").textContent = text;
      document.getElementById("login-status").textContent = text;
    }
    async function api(path, options) {
      const headers = Object.assign({}, options.headers || {});
      if (token()) headers.Authorization = "Bearer " + token();
      const response = await fetch(path, Object.assign({}, options, { headers }));
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || "Request failed");
      return data;
    }
    function pictureUrl(path) {
      const join = path.includes("?") ? "&" : "?";
      return path + join + "access_token=" + encodeURIComponent(token());
    }
    function pictureName(path) {
      const clean = String(path).split("?")[0];
      return decodeURIComponent(clean.slice(clean.lastIndexOf("/") + 1));
    }
    function trashIcon() {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("aria-hidden", "true");
      const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
      shape.setAttribute("fill", "currentColor");
      shape.setAttribute("d", "M9 3h6l1 2h4v2H4V5h4l1-2zm-2 6h10l-1 12H8L7 9zm3 2v8h2v-8h-2zm4 0v8h2v-8h-2z");
      svg.append(shape);
      return svg;
    }
    function when(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString();
    }
    function excerpt(text) {
      const flat = String(text || "").replace(/\s+/g, " ").trim();
      return flat.length > 140 ? flat.slice(0, 140) + "…" : flat;
    }
    function noteCategory(note) { return note.category || "Notes"; }
    function categoryNames() {
      const names = [];
      const seen = new Set(["latest"]);
      notes.forEach((note) => {
        const name = noteCategory(note);
        const key = name.toLocaleLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        names.push(name);
      });
      return names;
    }
    function queryText() { return document.getElementById("query").value.trim().toLowerCase(); }
    function visibleNotes() {
      const needle = queryText();
      return notes.filter((note) => {
        if (category !== "Latest" && noteCategory(note).toLocaleLowerCase() !== category.toLocaleLowerCase()) return false;
        if (!needle) return true;
        return (noteCategory(note) + "\n" + (note.title || "") + "\n" + (note.body || "")).toLowerCase().includes(needle);
      });
    }
    function showApp(on) {
      document.getElementById("gate").hidden = on;
      document.getElementById("app").hidden = !on;
    }
    function openNote(id) {
      composing = false;
      editing = false;
      confirmDelete = false;
      confirmPicture = "";
      selected = id;
      showReader = true;
      draw();
    }
    function drawCategories() {
      const nav = document.getElementById("categories");
      const names = categoryNames();
      const datalist = document.getElementById("known-categories");
      datalist.replaceChildren();
      names.forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        datalist.append(option);
      });
      nav.replaceChildren();
      ["Latest"].concat(names).forEach((name) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cat" + (category === name ? " active" : "");
        button.textContent = name;
        button.addEventListener("click", () => {
          category = name;
          showReader = false;
          composing = false;
          editing = false;
          confirmDelete = false;
          confirmPicture = "";
          draw();
        });
        nav.append(button);
      });
    }
    function drawBoard() {
      const board = document.getElementById("board");
      board.replaceChildren();
      const shown = visibleNotes();
      if (!shown.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = queryText()
          ? "No notes matched."
          : (notes.length ? "No notes in this category." : "Paste or dictate the first note.");
        board.append(empty);
        return;
      }
      const cards = document.createElement("div");
      cards.className = "cards";
      shown.forEach((note) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "card";
        if (note.pictures && note.pictures[0]) {
          const image = document.createElement("img");
          image.src = pictureUrl(note.pictures[0]);
          image.alt = "";
          button.append(image);
        } else {
          const cover = document.createElement("div");
          cover.className = "cover";
          button.append(cover);
        }
        const kicker = document.createElement("div");
        kicker.className = "kicker";
        kicker.textContent = noteCategory(note);
        const title = document.createElement("h2");
        title.textContent = note.title || "Note";
        const summary = document.createElement("p");
        summary.textContent = excerpt(note.body);
        button.append(kicker, title, summary);
        button.addEventListener("click", () => openNote(note.id));
        cards.append(button);
      });
      board.append(cards);
    }
    function categoryField(id, value) {
      const label = document.createElement("label");
      label.htmlFor = id;
      label.textContent = "Category";
      const input = document.createElement("input");
      input.id = id;
      input.value = value || "Notes";
      input.setAttribute("list", "known-categories");
      input.maxLength = 40;
      return [label, input];
    }
    function drawPane() {
      const pane = document.getElementById("pane");
      pane.replaceChildren();
      if (composing) {
        const title = document.createElement("h2");
        title.textContent = "New note";
        const fields = categoryField("new-category", category === "Latest" ? "Notes" : category);
        const box = document.createElement("textarea");
        box.id = "text";
        box.placeholder = "Paste a note";
        const save = document.createElement("button");
        save.className = "primary";
        save.type = "button";
        save.textContent = "Save";
        save.addEventListener("click", saveNote);
        const actions = document.createElement("div");
        actions.className = "actions";
        actions.append(save);
        pane.append(title, fields[0], fields[1], box, actions);
        return;
      }
      const note = notes.find((item) => item.id === selected);
      if (!note) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Paste or dictate the first note.";
        pane.append(empty);
        return;
      }
      const kicker = document.createElement("div");
      kicker.className = "kicker";
      kicker.textContent = noteCategory(note);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = when(note.created_at);
      let title;
      let body;
      const fields = [];
      if (editing) {
        fields.push.apply(fields, categoryField("edit-category", noteCategory(note)));
        title = document.createElement("input");
        title.id = "edit-title";
        title.className = "title-edit";
        title.value = note.title || "";
        body = document.createElement("textarea");
        body.id = "edit-body";
        body.value = note.body || "";
      } else {
        title = document.createElement("h2");
        title.textContent = note.title || "Note";
        body = document.createElement("div");
        body.className = "body";
        body.textContent = note.body || "";
      }
      const pictures = document.createElement("div");
      pictures.className = "pictures";
      (note.pictures || []).forEach((path) => {
        const name = pictureName(path);
        const shot = document.createElement("div");
        shot.className = "shot";
        const image = document.createElement("img");
        image.src = pictureUrl(path);
        image.alt = "";
        const removePhoto = document.createElement("button");
        removePhoto.type = "button";
        const armed = confirmPicture === name;
        removePhoto.className = "remove-photo" + (armed ? " confirm" : "");
        removePhoto.setAttribute("aria-label", armed ? "Delete this picture?" : "Delete picture");
        if (armed) removePhoto.textContent = "Delete?";
        else removePhoto.append(trashIcon());
        removePhoto.addEventListener("click", () => removePicture(note.id, name));
        shot.append(image, removePhoto);
        pictures.append(shot);
      });
      const edit = document.createElement("button");
      edit.type = "button";
      if (editing) {
        edit.className = "primary";
        edit.textContent = "Save";
        edit.addEventListener("click", () => saveEdit(note.id));
      } else {
        edit.className = "quiet";
        edit.textContent = "Edit";
        edit.addEventListener("click", () => {
          editing = true;
          confirmDelete = false;
          confirmPicture = "";
          drawPane();
        });
      }
      const pick = document.createElement("label");
      pick.className = "pick";
      const file = document.createElement("input");
      file.type = "file";
      file.accept = "image/*";
      file.addEventListener("change", () => addPicture(note.id, file));
      pick.append(document.createTextNode("Add picture"), file);
      const print = document.createElement("button");
      print.className = "quiet";
      print.type = "button";
      print.textContent = "Print";
      print.addEventListener("click", () => printNote(note.id));
      const remove = document.createElement("button");
      remove.className = "danger" + (confirmDelete ? " confirm" : "");
      remove.type = "button";
      remove.textContent = confirmDelete ? "Delete this note?" : "Delete";
      remove.addEventListener("click", () => {
        confirmPicture = "";
        removeNote(note.id);
      });
      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(edit, pick, print, remove);
      if (editing) {
        const cancel = document.createElement("button");
        cancel.className = "quiet";
        cancel.type = "button";
        cancel.textContent = "Cancel";
        cancel.addEventListener("click", () => {
          editing = false;
          drawPane();
        });
        actions.append(cancel);
      }
      pane.append(title, meta, body, pictures, actions);
      if (editing) fields.forEach((field) => pane.insertBefore(field, title));
      else pane.insertBefore(kicker, title);
    }
    function syncLayout() {
      document.getElementById("app").classList.toggle("reading", showReader);
    }
    function draw() {
      const names = categoryNames();
      if (category !== "Latest" && !names.some((name) => name.toLocaleLowerCase() === category.toLocaleLowerCase())) {
        category = "Latest";
      }
      drawCategories();
      drawBoard();
      drawPane();
      syncLayout();
    }
    async function load() {
      const data = await api("/v1/library/notes?q=", { headers: {} });
      notes = data.notes || [];
      const names = categoryNames();
      if (category !== "Latest" && !names.some((name) => name.toLocaleLowerCase() === category.toLocaleLowerCase())) {
        category = "Latest";
      }
      if (selected && !notes.some((note) => note.id === selected)) {
        selected = "";
        showReader = false;
      }
      draw();
    }
    async function saveNote() {
      const text = document.getElementById("text").value.trim();
      const chosen = document.getElementById("new-category").value.trim() || "Notes";
      if (!text) return;
      setStatus("Saving…");
      try {
        const saved = await api("/v1/library/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, category: chosen }),
        });
        composing = false;
        selected = saved.id;
        category = saved.category || chosen;
        showReader = true;
        setStatus("Saved.");
        await load();
      } catch (err) {
        setStatus(err.message);
      }
    }
    async function saveEdit(id) {
      const title = document.getElementById("edit-title").value.trim();
      const text = document.getElementById("edit-body").value.trim();
      const chosen = document.getElementById("edit-category").value.trim() || "Notes";
      if (!text) {
        setStatus("The note is empty.");
        return;
      }
      setStatus("Saving…");
      try {
        await api("/v1/library/notes/" + id, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, title, category: chosen }),
        });
        editing = false;
        selected = id;
        category = chosen;
        setStatus("Saved.");
        await load();
      } catch (err) {
        setStatus(err.message);
      }
    }
    async function addPicture(id, file) {
      const chosen = file.files && file.files[0];
      if (!chosen) return;
      const form = new FormData();
      form.append("file", chosen);
      setStatus("Adding picture…");
      try {
        const saved = await api("/v1/library/notes/" + id + "/pictures", { method: "POST", body: form, headers: {} });
        notes = notes.map((item) => item.id === id ? saved : item);
        setStatus("Picture added.");
        draw();
      } catch (err) {
        setStatus(err.message);
      }
    }
    async function removePicture(id, name) {
      if (confirmPicture !== name) {
        confirmPicture = name;
        confirmDelete = false;
        drawPane();
        return;
      }
      setStatus("Deleting picture…");
      try {
        const saved = await api("/v1/library/notes/" + id + "/pictures/" + encodeURIComponent(name), {
          method: "DELETE",
          headers: {},
        });
        confirmPicture = "";
        notes = notes.map((item) => item.id === id ? saved : item);
        setStatus("Picture deleted.");
        draw();
      } catch (err) {
        confirmPicture = "";
        setStatus(err.message);
        drawPane();
      }
    }
    async function printNote(id) {
      setStatus("Printing…");
      try {
        const result = await api("/v1/library/notes/" + id + "/print", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        });
        setStatus(result.message || "Sent to the printer.");
      } catch (err) {
        setStatus(err.message);
      }
    }
    async function removeNote(id) {
      if (!confirmDelete) {
        confirmDelete = true;
        drawPane();
        return;
      }
      setStatus("Deleting…");
      try {
        await api("/v1/library/notes/" + id, { method: "DELETE", headers: {} });
        confirmDelete = false;
        notes = notes.filter((item) => item.id !== id);
        selected = "";
        showReader = false;
        setStatus("Deleted.");
        draw();
      } catch (err) {
        confirmDelete = false;
        setStatus(err.message);
        drawPane();
      }
    }
    document.getElementById("login").addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("Signing in…");
      try {
        const data = await api("/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("user").value,
            password: document.getElementById("pass").value,
            device_name: "library-page",
            device_role: "station",
          }),
        });
        sessionStorage.setItem(tokenKey, data.access_token);
        showApp(true);
        setStatus("");
        await load();
      } catch (err) {
        setStatus(err.message);
      }
    });
    document.getElementById("signout").addEventListener("click", () => {
      sessionStorage.removeItem(tokenKey);
      notes = [];
      selected = "";
      category = "Latest";
      composing = false;
      editing = false;
      showReader = false;
      confirmPicture = "";
      showApp(false);
      setStatus("");
    });
    document.getElementById("new-note").addEventListener("click", () => {
      composing = true;
      editing = false;
      confirmDelete = false;
      confirmPicture = "";
      showReader = true;
      draw();
    });
    document.getElementById("back").addEventListener("click", () => {
      showReader = false;
      composing = false;
      editing = false;
      confirmDelete = false;
      confirmPicture = "";
      draw();
    });
    document.getElementById("query").addEventListener("input", () => draw());
    if (token()) {
      showApp(true);
      load().catch((err) => setStatus(err.message));
    }
  </script>
</body>
</html>
