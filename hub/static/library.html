<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge library</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; }
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    section { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin: 10px 0 4px; }
    input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
    textarea { min-height: 120px; }
    button { background: #2563eb; color: white; border: 0; border-radius: 8px; padding: 8px 14px; margin: 8px 8px 0 0; }
    button.quiet { background: #334155; }
    .note { border-top: 1px solid #334155; padding-top: 12px; margin-top: 12px; }
    .note h2 { font-size: 1.05rem; margin: 0 0 6px; }
    .note p { white-space: pre-wrap; line-height: 1.45; }
    img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    .status { color: #93c5fd; min-height: 1.2em; }
  </style>
</head>
<body>
  <main>
    <h1>Knowledge library</h1>
    <p class="status" id="status"></p>

    <section id="login">
      <label>Username</label>
      <input id="user" value="owner" autocomplete="username" />
      <label>Password</label>
      <input id="pass" type="password" value="changeme" autocomplete="current-password" />
      <button id="signin" type="button">Sign in</button>
    </section>

    <section id="editor" hidden>
      <label>Paste a note</label>
      <textarea id="text"></textarea>
      <button id="save" type="button">Save</button>
      <label>Search</label>
      <input id="query" />
      <button id="find" type="button">Search</button>
      <div id="results"></div>
    </section>
  </main>
  <script>
    const status = document.getElementById("status");
    const tokenKey = "libraryToken";
    function token() { return sessionStorage.getItem(tokenKey) || ""; }
    function setStatus(text) { status.textContent = text; }
    async function api(path, options) {
      const headers = options.headers || {};
      if (token()) headers.Authorization = "Bearer " + token();
      const response = await fetch(path, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || data.detail || "Request failed");
      return data;
    }
    function showEditor(on) {
      document.getElementById("login").hidden = on;
      document.getElementById("editor").hidden = !on;
    }
    function pictureUrl(path) {
      const join = path.includes("?") ? "&" : "?";
      return path + join + "access_token=" + encodeURIComponent(token());
    }
    function draw(notes) {
      const root = document.getElementById("results");
      root.replaceChildren();
      notes.forEach((note) => {
        const block = document.createElement("article");
        block.className = "note";
        const title = document.createElement("h2");
        title.textContent = note.title || "Note";
        const body = document.createElement("p");
        body.textContent = note.body || "";
        block.append(title, body);
        (note.pictures || []).forEach((path) => {
          const image = document.createElement("img");
          image.src = pictureUrl(path);
          image.alt = "";
          block.append(image);
        });
        const file = document.createElement("input");
        file.type = "file";
        file.accept = "image/*";
        file.addEventListener("change", async () => {
          const chosen = file.files && file.files[0];
          if (!chosen) return;
          const form = new FormData();
          form.append("file", chosen);
          setStatus("Adding picture…");
          const saved = await api("/v1/library/notes/" + note.id + "/pictures", { method: "POST", body: form, headers: {} });
          setStatus("Picture added.");
          draw(notes.map((item) => item.id === note.id ? saved : item));
        });
        const print = document.createElement("button");
        print.type = "button";
        print.textContent = "Print";
        print.addEventListener("click", async () => {
          setStatus("Printing…");
          const result = await api("/v1/library/notes/" + note.id + "/print", { method: "POST", headers: { "Content-Type": "application/json" } });
          setStatus(result.message || (result.ok ? "Sent to the printer." : "The printer did not accept the page."));
        });
        block.append(file, print);
        root.append(block);
      });
    }
    async function load(query) {
      const data = await api("/v1/library/notes?q=" + encodeURIComponent(query || ""), { headers: {} });
      draw(data.notes || []);
    }
    document.getElementById("signin").addEventListener("click", async () => {
      setStatus("Signing in…");
      try {
        const data = await api("/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("user").value,
            password: document.getElementById("pass").value,
            device_name: "library-page",
            device_role: "station",
          }),
        });
        sessionStorage.setItem(tokenKey, data.access_token);
        showEditor(true);
        setStatus("");
        await load("");
      } catch (err) {
        setStatus(err.message);
      }
    });
    document.getElementById("save").addEventListener("click", async () => {
      const text = document.getElementById("text").value.trim();
      if (!text) return;
      setStatus("Saving…");
      try {
        await api("/v1/library/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        document.getElementById("text").value = "";
        setStatus("Saved.");
        await load(document.getElementById("query").value);
      } catch (err) {
        setStatus(err.message);
      }
    });
    document.getElementById("find").addEventListener("click", async () => {
      try { await load(document.getElementById("query").value); }
      catch (err) { setStatus(err.message); }
    });
    if (token()) {
      showEditor(true);
      load("").catch((err) => setStatus(err.message));
    }
  </script>
</body>
</html>
