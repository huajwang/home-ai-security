# nginx stream in front of the existing site.
# yaojiabuy.com and www stay on the current Yaojia nginx, moved to 127.0.0.1:8445.
# TLS for *.link.yaojiabuy.com and the hub's raw peer handshake go to snitun.
# link.yaojiabuy.com itself (the apex) is the backup and voice API.

stream {
    map $ssl_preread_protocol $link_upstream {
        ""                      127.0.0.1:4430;
        default                 $link_by_name;
    }
    map $ssl_preread_server_name $link_by_name {
        hostnames;
        link.yaojiabuy.com      127.0.0.1:8446;
        ~\.link\.yaojiabuy\.com$ 127.0.0.1:4430;
        default                 127.0.0.1:8445;
    }
    server {
        listen 443;
        listen [::]:443;
        proxy_pass $link_upstream;
        ssl_preread on;
        proxy_connect_timeout 10s;
    }
}
