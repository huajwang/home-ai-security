# TLS for https://link.yaojiabuy.com only. The house names (*.link.yaojiabuy.com)
# are not terminated here; nginx stream sends those to snitun.
# Issue the certificate with DNS-01 or HTTP-01 after the DNS record exists:
#   certbot certonly --nginx -d link.yaojiabuy.com

server {
    listen 127.0.0.1:8446 ssl;
    server_name link.yaojiabuy.com;
    ssl_certificate /etc/letsencrypt/live/link.yaojiabuy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.yaojiabuy.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }
}
