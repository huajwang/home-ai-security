# TURN for Cloud Link media only. LAN and Tailscale do not use this server.
# The Aliyun security group must allow UDP 3478 and UDP 49160-49200
# before a phone outside the house can receive video. TCP 443 is not enough.

listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_HUB_TURN_SECRET
realm=link.yaojiabuy.com
total-quota=12
stale-nonce=600
no-multicast-peers
no-cli
min-port=49160
max-port=49200
log-file=/var/log/turnserver.log
simple-log
